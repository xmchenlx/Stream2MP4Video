<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />

    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
        <div id="drop-zone"
            style="width: 100%; height: 200px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center;">
            将 TS 视频拖拽到此处
        </div>
        <div id="log" style="background: #000; color: #0f0; padding: 10px; margin-top: 20px; height: 150px; overflow-y: auto;">
            等待任务...
        </div>
      <img alt="logo" class="logo" src="./assets/electron.svg" />
      <div class="creator">Powered by electron-vite</div>
      <div class="text">
        Build an Electron app with
        <span class="js">JavaScript</span>
      </div>
      <p class="tip">Please try pressing <code>F12</code> to open the devTool</p>
      <div class="actions">
        <div class="action">
          <a href="https://electron-vite.org/" target="_blank" rel="noreferrer">Documentation</a>
        </div>
        <div class="action">
          <a id="ipcHandler" target="_blank" rel="noreferrer">Send IPC</a>
        </div>
      </div>

      <ul class="versions">
        <li class="electron-version"></li>
        <li class="chrome-version"></li>
        <li class="node-version"></li>
      </ul>
    </div>

    <script type="module" src="./src/renderer.js"></script>
  </body>
</html>
